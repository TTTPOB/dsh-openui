<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>OpenUI 独立渲染岛</title>
<body><h1>React 19 贷款模拟器</h1><div id="island"></div><pre id="error" role="alert"></pre>
<script type="module">
import { mount } from '../dist/island.js';
const response = await (await fetch('../examples/loan.openui')).text();
window.actions = [];
window.islandHandle = mount(document.getElementById('island').attachShadow({ mode: 'open' }), {
  response, onAction: action => window.actions.push(action),
  onError: error => document.getElementById('error').textContent = JSON.stringify(error),
});
</script></body></html>
